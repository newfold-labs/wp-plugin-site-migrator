name: Tests

on:
    push:
        branches:
            - master
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

concurrency:
    group: tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    unit:
        name: Unit
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # The floor and something current. The floor is what the plugin header promises,
                # and it is the one that catches modern syntax slipping in.
                php: ['7.4', '8.3']
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - uses: shivammathur/setup-php@ccf2c627fe61b1b4d924adfcbd19d661a18133a0 # v2.31.1
              with:
                  php-version: ${{ matrix.php }}
                  extensions: zip, mysqli
                  coverage: none

            - name: Cache Composer
              uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
              with:
                  path: ~/.cache/composer
                  key: composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: composer-${{ matrix.php }}-

            - run: composer install --prefer-dist --no-progress

            - name: PHPUnit
              run: vendor/bin/phpunit

    roundtrip:
        name: Round trip
        runs-on: ubuntu-latest
        # Slow, and it provisions two WordPress installs against a real database. Worth it: every
        # defect found in this plugin since the rework began was found by running it, not reading it.
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: root
                ports: ['3306:3306']
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - uses: shivammathur/setup-php@ccf2c627fe61b1b4d924adfcbd19d661a18133a0 # v2.31.1
              with:
                  php-version: '8.3'
                  extensions: zip, mysqli
                  coverage: none

            - run: composer install --prefer-dist --no-progress

            - name: Install WP-CLI
              run: |
                  curl -sSLo /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
                  chmod +x /tmp/wp-cli.phar
                  sudo mv /tmp/wp-cli.phar /usr/local/bin/wp

            - name: Create the two databases
              run: |
                  mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE nfd_src; CREATE DATABASE nfd_dst;"

            - name: Round trip
              env:
                  NFD_DB_HOST: 127.0.0.1
                  NFD_DB_USER: root
                  NFD_DB_PASS: root
              run: bash tests/roundtrip.sh

    package:
        name: Installable zip
        runs-on: ubuntu-latest
        # Builds the artefact and then installs it into a real WordPress. A release is the worst
        # moment to discover the zip unpacks to the wrong directory or ships without its assets.
        # Nothing is uploaded: this is a test that the zip works, and the only workflow that
        # publishes anything is the one that runs on a published release.
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: root
                ports: ['3306:3306']
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
              with:
                  node-version: 24

            - uses: shivammathur/setup-php@ccf2c627fe61b1b4d924adfcbd19d661a18133a0 # v2.31.1
              with:
                  php-version: '8.3'
                  extensions: zip, mysqli
                  coverage: none

            - run: npm ci
            - run: composer install --prefer-dist --no-progress

            - name: Install WP-CLI
              run: |
                  curl -sSLo /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
                  chmod +x /tmp/wp-cli.phar
                  sudo mv /tmp/wp-cli.phar /usr/local/bin/wp

            - name: Create the database
              run: mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE nfd_src;"

            - name: Build
              run: bash bin/build-zip.sh

            - name: Install it and check it runs
              env:
                  NFD_DB_HOST: 127.0.0.1
                  NFD_DB_USER: root
                  NFD_DB_PASS: root
              run: bash bin/verify-zip.sh

    e2e:
        name: Browser
        runs-on: ubuntu-latest
        # Unstubbed: a real WordPress, the real plugin, the real REST API. This replaced a Cypress
        # spec that intercepted every route -- it asserted React can render fixtures, and by the
        # end it was clicking element IDs that no longer existed in src/.
        #
        # wp-env is started here rather than from inside Playwright's `webServer`, so a container
        # that fails to come up reads as an environment failure and not as a test failure.
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
              with:
                  node-version: 24
                  cache: npm

            - uses: shivammathur/setup-php@ccf2c627fe61b1b4d924adfcbd19d661a18133a0 # v2.31.1
              with:
                  php-version: '8.3'
                  extensions: zip
                  coverage: none

            - run: npm ci
            - run: composer install --prefer-dist --no-progress

            # `build/` is generated and untracked, and the admin page is an empty div without it --
            # which is exactly what these tests check for, so it has to exist first or they would
            # fail for the wrong reason.
            - run: npm run build

            # wp-env is an optional dependency: it pulls a native module with prebuilt binaries
            # only up to Node 25, so it cannot install on newer Node and must not take `npm
            # install` down with it. Here it is required, so its absence is stated plainly rather
            # than surfacing later as a connection refused.
            - name: Check wp-env installed
              run: |
                  test -d node_modules/@wordpress/env || {
                    echo "@wordpress/env did not install. The browser suite needs it."
                    exit 1
                  }

            - name: Start WordPress
              run: npx wp-env start

            - run: npx playwright install --with-deps chromium

            - name: Browser tests
              run: npm run test:e2e

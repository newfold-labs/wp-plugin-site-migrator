name: Lint

on:
    push:
        branches:
            - main
        paths:
            - '**.php'
    pull_request:
        types: [opened, edited, synchronize, reopened]
        paths:
            - '**.php'

jobs:
    phpcs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Validate composer.json and composer.lock
              run: composer validate

            - name: Get Composer Cache Directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer vendor directory
              uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress --no-suggest

            # `composer fix` deliberately does not run here. It did, immediately before the lint
            # step, which meant CI could not fail on anything phpcbf can repair -- it silently
            # repaired it and linted the result. Worse, that ruleset rewrites string *literals*
            # ("spell WordPress correctly" applies inside strings), and this codebase keys a lot
            # of behaviour on strings. Fixing is a thing a person does locally and reads the diff
            # of; CI's job is to report.
            - name: Detecting PHP Code Standards Violations
              run: composer run-script lint

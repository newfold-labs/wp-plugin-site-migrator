name: Package Plugin

# The only workflow that publishes anything. Everything else in .github/workflows reports.
#
# Triggered by publishing a release rather than by pushing a tag: publishing is the deliberate
# act, and it means there is already a release for the asset to hang off. A mistyped tag stays a
# mistyped tag.
on:
    release:
        types:
            - published

permissions:
    contents: write

jobs:
    package:
        name: Build and attach the zip
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
              with:
                  node-version: 24
                  cache: npm

            - uses: shivammathur/setup-php@ccf2c627fe61b1b4d924adfcbd19d661a18133a0 # v2.31.1
              with:
                  php-version: '8.3'
                  extensions: zip
                  coverage: none

            - name: Install dependencies
              run: |
                  npm ci
                  composer install --prefer-dist --no-progress

            # One build recipe, the same one a person runs locally. This step also asserts what is
            # in the staged tree before zipping -- the bundle, the stylesheet, the asset manifest,
            # the fonts, the licences -- because `build/` is generated and untracked, and a zip
            # built without it installs cleanly and then renders an empty admin page.
            - name: Build
              run: bash bin/build-zip.sh

            - name: Attach it to the release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release upload "${{ github.event.release.tag_name }}" dist/nfd-site-migrator.zip --clobber
